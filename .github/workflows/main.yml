9. Set the application name to:
   Bubble Burst Odyssey
10. Use package name:
   com.bubbleburst.odyssey
11. Create a debug APK and make sure it actually builds successfully.
12. Also create a GitHub Actions workflow at:
   .github/workflows/build-apk.yml
13. The GitHub Actions workflow must:
   - checkout the repository
   - setup Node.js
   - run npm install --legacy-peer-deps
   - run npm run build
   - copy the dist files into the Android WebView assets
   - setup Java 17
   - build the Android APK with Gradle
