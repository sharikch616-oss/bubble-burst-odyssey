name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          unzip -q bubble-burst-odyssey-android-ready.zip -d project

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build web game
        run: |
          cd project/bubble-burst-odyssey-android/web-source
          npm install
          npm run build
          rm -rf ../app/src/main/assets/www/*
          cp -R dist/. ../app/src/main/assets/www/

      - name: Create Gradle wrapper
        run: |
          cd project/bubble-burst-odyssey-android
          gradle wrapper --gradle-version 8.11.1

      - name: Build Android APK
        run: |
          cd project/bubble-burst-odyssey-android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bubble-burst-odyssey-apk
          path: project/bubble-burst-odyssey-android/app/build/outputs/apk/debug/*.apk
