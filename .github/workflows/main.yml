1. Inspect the entire uploaded project first.
2. Do NOT remove or break any existing game functionality, UI, graphics, sounds, animations, scoring, or gameplay.
3. Build the React/Vite project into production files using:
   npm install --legacy-peer-deps
   npm run build
4. Create a native Android WebView wrapper around the generated web build.
5. Use a standard Gradle Android project that can build with GitHub Actions.
6. Include:
   - AndroidManifest.xml
   - Gradle files
   - Gradle wrapper
   - MainActivity
   - WebView configuration
